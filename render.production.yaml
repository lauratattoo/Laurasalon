# Optional paid production configuration. Apply to the existing Render service.
services:
  - type: web
    name: salon-tattoo-laura
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: salon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_STORAGE
        value: 'true'
      - key: APP_MODE
        value: live
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://tattoowebside.onrender.com
      - key: SALON_EMAIL
        value: Tattoolaura@seznam.cz
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
