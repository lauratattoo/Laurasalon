# Deploy this repository as a NEW Node Web Service, not a Static Site.
# The Starter instance and persistent disk are paid Render resources.
services:
  - type: web
    name: laurasalon-server
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: laura-reservations
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_STORAGE
        value: 'true'
      - key: APP_MODE
        value: live
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SALON_EMAIL
        value: Tattoolaura@seznam.cz
