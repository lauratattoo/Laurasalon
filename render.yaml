services:
  - type: web
    name: salon-tattoo-laura
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_MODE
        value: demo
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SALON_EMAIL
        value: Tattoolaura@seznam.cz
